<!DOCTYPE html>
<html>
    <body>
        <div style="
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;">
    
        <h1 style="color: #333">📩 Nuevo mensaje de {{name}}</h1>
        <p><strong>Nombre:</strong> {{name}}</p>
        <p><strong>Correo:</strong> <a href="mailto:{{email}}" style="color: #007bff">{{email}}</a></p>
        <p><strong>Mensaje:</strong></p>
        <blockquote style="
            font-style: italic;
            background-color: #fff;
            padding: 10px;
            border-left: 4px solid #007bff;">
            {{message}}
        </blockquote>
        <p><strong>Fecha:</strong> {{current_date}}</p>
        <hr />
        <p style="font-size: 12px; color: #666">
            🔔 No olvides responder este mensaje lo antes posible.
        </p>
        </div>
    </body>
</html>
