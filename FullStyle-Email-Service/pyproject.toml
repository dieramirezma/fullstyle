[tool.ruff]
target-version = "py313"
line-length = 100
include = ["app.py", "config/identity.py", "config/rabbitmq_config.py", "services/*.py", "routes/*.py", "workers/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]

# Direct script entrypoint needs sys.path bootstrap before application imports.
"workers/email_worker.py" = ["E402"]
