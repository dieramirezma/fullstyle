name: Validate FullStyle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fullstyle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.2'
          channel: stable
      - name: Check publication and secrets
        run: |
          python scripts/publication_check.py
          python scripts/scan_secrets.py --history
      - name: Install locked tools
        run: |
          npm install --global pnpm@10.8.1
          python scripts/bootstrap.py
      - name: Validate quality, behavior and clean reproduction
        run: .venv/bin/python scripts/ci.py
      - name: Upload synthetic validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-validation
          path: .quality/reports/
          include-hidden-files: true
          retention-days: 7
      - name: Stop only this demo project
        if: always()
        run: docker compose down --volumes --remove-orphans
