worker_processes auto;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    client_max_body_size 1100k;
    large_client_header_buffers 4 16k;
    map $http_x_correlation_id $correlation_id {
        default $request_id;
        "~^[A-Za-z0-9._-]{1,80}$" $http_x_correlation_id;
    }
    map $http_x_operation_id $operation_id {
        default $request_id;
        "~^[A-Za-z0-9._-]{1,80}$" $http_x_operation_id;
    }
    log_format local '$remote_addr $request_method $uri $status $request_time cid=$correlation_id op=$operation_id';
    access_log /dev/stdout local;
    limit_req_zone $binary_remote_addr zone=provider:10m rate=5r/s;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream gateway_up { zone gateway_zone 64k; server gateway:4000 resolve; }
    upstream frontend_up { zone frontend_zone 64k; server frontend:3000 resolve; }
    upstream backend_up { zone backend_zone 64k; server backend:5000 resolve; }
    upstream auth_up { zone auth_zone 64k; server auth:5001 resolve; }
    upstream chatbot_up { zone chatbot_zone 64k; server chatbot:8080 resolve; }
    upstream email_up { zone email_zone 64k; server email:5002 resolve; }
    upstream firebase_auth_up { zone firebase_auth_zone 64k; server firebase:9099 resolve; }
    upstream firestore_up { zone firestore_zone 64k; server firebase:8085 resolve; }
    server {
        listen 80;
        server_name localhost;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_id;
        proxy_set_header X-Operation-ID $operation_id;
        proxy_hide_header X-Correlation-ID;
        proxy_hide_header X-Operation-ID;
        add_header X-Correlation-ID $correlation_id always;
        add_header X-Operation-ID $operation_id always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'" always;
        location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
        location /graphql { proxy_pass http://gateway_up/; }
        location /api/graphql/ { proxy_pass http://gateway_up/; }
        location /api/logic/ { proxy_pass http://backend_up/api/; }
        location /business/ { proxy_pass http://backend_up/; }
        location /auth/ { proxy_pass http://auth_up/; }
        location = /chatbot { proxy_pass http://frontend_up; }
        location /chatbot/ { proxy_pass http://chatbot_up/; }
        location /api/chat/ { proxy_pass http://chatbot_up/api/v1/chat/; }
        location /mail/ { proxy_pass http://email_up/; }
        location /identitytoolkit.googleapis.com/ { proxy_pass http://firebase_auth_up; }
        location /securetoken.googleapis.com/ { proxy_pass http://firebase_auth_up; }
        location /google.firestore.v1.Firestore/ { proxy_pass http://firestore_up; proxy_buffering off; }
        location /v1/projects/demo-fullstyle/ { proxy_pass http://firestore_up; }
        location /api/ {
            limit_req zone=provider burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://frontend_up;
        }
        location / { proxy_pass http://frontend_up; }
    }
}
