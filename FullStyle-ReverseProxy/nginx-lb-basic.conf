worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5:!PSK;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none';" always;

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" '
                     'upstream: $upstream_addr response_time: $upstream_response_time '
                     'ssl_protocol: $ssl_protocol ssl_cipher: $ssl_cipher';

    # WAF specific log format
    log_format waf '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'waf_action: $waf_action waf_rule: $waf_rule';

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/waf.log waf;

    # Configuración de buffers
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # WAF Configuration
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=graphql_rate_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=graphql_burst_limit:10m rate=30r/m;

    # Map for malicious patterns
    map $request_body $waf_action {
        default "";
        ~*(union|select|insert|update|delete|drop|create|alter|exec|execute|script|javascript|vbscript|onload|onerror|onclick) "block";
        ~*(<script|javascript:|vbscript:|onload=|onerror=|onclick=) "block";
        ~*(union.*select|select.*from|insert.*into|update.*set|delete.*from) "block";
        ~*(\\'.*OR.*\\'|\\'.*AND.*\\') "block";
        ~*(OR.*1=1|AND.*1=1|OR.*1=0|AND.*1=0) "block";
    }

    # Map for suspicious headers - Consolidated user agents
    map $http_user_agent $suspicious_ua {
        default "";
        ~*(sqlmap|nikto|nmap|nessus|acunetix|burp|w3af|zap) "block";
        ~*(bot|crawler|spider|scraper) "monitor";
    }

    # Map for content type validation
    map $content_type $valid_content_type {
        default "";
        "application/json" "valid";
        "application/graphql" "valid";
        "text/plain" "valid";
    }

    map $http_content_length $large_payload {
        default "";
        "~^[1-9][0-9]{6,}$" "block";  # > 999999 bytes
    }

    # LOAD BALANCING GROUPS
    # API Gateway Load Balancing (Least Connections)
    upstream apollo_gateway_lb {
        least_conn;
        server fs_ag_1:4000 max_fails=3 fail_timeout=30s;
        server fs_ag_2:4000 max_fails=3 fail_timeout=30s;
    }

    # Frontend Load Balancing (IP Hash - sticky sessions)
    upstream frontend_lb {
        ip_hash;
        server fs_fw_1:3000 max_fails=3 fail_timeout=30s;
        server fs_fw_2:3000 max_fails=3 fail_timeout=30s;
    }

    # Microservices Load Balancing (Weighted Round Robin)
    upstream logic_service_lb {
        server fs_ms_lc_1:5000 weight=3 max_fails=3 fail_timeout=30s;
        server fs_ms_lc_2:5000 weight=2 max_fails=3 fail_timeout=30s;
    }

    # Auth Service Load Balancing (Round Robin con pesos diferentes)
    upstream auth_service_lb {
        server fs_ms_au_1:5000 weight=5 max_fails=3 fail_timeout=30s;
        server fs_ms_au_2:5000 weight=1 max_fails=3 fail_timeout=30s backup;
    }

    # Chatbot Service Load Balancing (Least Connections)
    upstream chatbot_service_lb {
        least_conn;
        server fs_ms_cb_1:8080 max_fails=3 fail_timeout=30s;
        server fs_ms_cb_2:8080 max_fails=3 fail_timeout=30s;
    }

    # HTTP server with CORS support for GraphQL
    server {
        listen 80 default_server;
        server_name localhost *.fullstyle.com;

        # Allow Let's Encrypt validation
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        # GraphQL API con CORS en HTTP
        location ~ ^/graphql/?$ {
            # CORS preflight handling
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            # WAF Method Validation
            if ($request_method !~ ^(GET|POST|OPTIONS)$) {
                return 405;
            }

            # Proxy to GraphQL Gateway
            proxy_pass http://apollo_gateway_lb;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # CORS headers para respuestas regulares
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'X-HTTP-GraphQL' 'enabled' always;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server with WAF and Load Balancing
    server {
        listen 443 ssl http2;
        server_name localhost *.fullstyle.com;

        # SSL certificate paths (to be mounted as volumes)
        ssl_certificate /etc/ssl/fullstyle.crt;
        ssl_certificate_key /etc/ssl/fullstyle.key;

        # SSL optimization
        ssl_dhparam /etc/ssl/dhparam.pem;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-WAF-Enabled "true";

        # GraphQL API con WAF y Load Balancing
        location /graphql {
            # Initialize WAF variables
            set $waf_action "";
            set $waf_rule "";

            # Debug: Log the request body for WAF testing
            access_log /var/log/nginx/waf_debug.log main;

            # WAF Rate Limiting
            limit_req zone=graphql_rate_limit burst=20 nodelay;
            limit_req zone=graphql_burst_limit burst=5 nodelay;

            # WAF Request Size Limits
            client_max_body_size 1m;
            client_body_buffer_size 128k;

            # Read request body for WAF inspection
            client_body_in_file_only off;
            client_body_in_single_buffer on;

            # WAF Method Validation
            if ($request_method !~ ^(GET|POST|OPTIONS)$) {
                set $waf_action "block";
                set $waf_rule "invalid_method";
                return 405;
            }

            # WAF Suspicious User Agent Detection - Consolidated
            if ($suspicious_ua = "block") {
                set $waf_action "block";
                set $waf_rule "suspicious_user_agent";
                return 403;
            }

            # WAF Query String Validation
            if ($args ~* "(union|select|insert|update|delete|drop|create|alter|exec|execute)") {
                set $waf_action "block";
                set $waf_rule "malicious_query_string";
                return 403;
            }

            # WAF Header Validation (Payload Size)
            if ($large_payload = "block") {
                set $waf_action "block";
                set $waf_rule "payload_too_large";
                return 413;
            }

            # WAF Body Content Validation (SQL Injection patterns)
            if ($request_body ~* "(union|select|insert|update|delete|drop|create|alter|exec|execute)") {
                set $waf_action "block";
                set $waf_rule "sql_injection_body";
                return 403;
            }

            # WAF Body Content Validation (SQL Injection with quotes - simplified)
            if ($request_body ~* "OR.*1=1") {
                set $waf_action "block";
                set $waf_rule "sql_injection_or_condition";
                return 403;
            }

            if ($request_body ~* "AND.*1=1") {
                set $waf_action "block";
                set $waf_rule "sql_injection_and_condition";
                return 403;
            }

            # WAF Body Content Validation (SQL Injection with single quotes)
            if ($request_body ~* "'.*OR.*'") {
                set $waf_action "block";
                set $waf_rule "sql_injection_or_quotes";
                return 403;
            }

            if ($request_body ~* "'.*AND.*'") {
                set $waf_action "block";
                set $waf_rule "sql_injection_and_quotes";
                return 403;
            }

            # WAF Body Content Validation (SQL Injection with escaped quotes)
            if ($request_body ~* "\\'.*OR.*\\'") {
                set $waf_action "block";
                set $waf_rule "sql_injection_or_escaped";
                return 403;
            }

            if ($request_body ~* "\\'.*AND.*\\'") {
                set $waf_action "block";
                set $waf_rule "sql_injection_and_escaped";
                return 403;
            }

            # WAF Body Content Validation (Specific SQL Injection patterns)
            if ($request_body ~* "OR.*1.*=.*1") {
                set $waf_action "block";
                set $waf_rule "sql_injection_or_equals";
                return 403;
            }

            if ($request_body ~* "AND.*1.*=.*1") {
                set $waf_action "block";
                set $waf_rule "sql_injection_and_equals";
                return 403;
            }

            # WAF Body Content Validation (Simple pattern test)
            if ($request_body ~* "OR") {
                set $waf_action "block";
                set $waf_rule "sql_injection_or_simple";
                return 403;
            }

            # WAF Body Content Validation (XSS patterns)
            if ($request_body ~* "(<script|javascript:|vbscript:|onload=|onerror=|onclick=)") {
                set $waf_action "block";
                set $waf_rule "xss_injection";
                return 403;
            }

            # WAF Body Content Validation (NoSQL Injection)
            if ($request_body ~* "(\$where|\$ne|\$gt|\$lt|\$regex)") {
                set $waf_action "block";
                set $waf_rule "nosql_injection";
                return 403;
            }

            # WAF Body Content Validation (General malicious patterns from map)
            if ($waf_action = "block") {
                set $waf_rule "malicious_pattern_detected";
                return 403;
            }

            # SSL-aware proxy headers
            proxy_pass http://apollo_gateway_lb/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-SSL-Protocol $ssl_protocol;
            proxy_set_header X-SSL-Cipher $ssl_cipher;
            proxy_cache_bypass $http_upgrade;

            # Load balancer específico headers
            proxy_set_header X-Load-Balancer "nginx";
            proxy_set_header X-WAF-Status "passed";
            add_header X-Upstream-Server $upstream_addr;
            add_header X-WAF-Version "1.0";
            add_header X-API-SSL-Protected "true" always;
        }

        # Rutas para archivos estáticos de Next.js
        location /_next/ {
            proxy_pass http://frontend_lb/_next/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Cache para archivos estáticos con SSL
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header X-SSL-Cache "enabled";
        }

        # Archivos estáticos públicos
        location /public/ {
            proxy_pass http://frontend_lb/public/;
            proxy_set_header Host $host;

            # Cache para recursos públicos
            expires 1d;
            add_header Cache-Control "public";
        }

        # API directa a microservicios (opcional)
        location /api/logic/ {
            proxy_pass http://logic_service_lb/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ruta general para API
        location /api/ {
            proxy_pass http://logic_service_lb/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        }

        # Authentication routes
        location /api/auth/ {
            # NextAuth specific endpoints - dirigir al frontend
            location ~ ^/api/auth/(.*)$ {
                proxy_pass http://frontend_lb$request_uri;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_buffer_size 128k;
                proxy_buffers 4 256k;
                proxy_busy_buffers_size 256k;
            }

            # Fallback para rutas no capturadas
            proxy_pass http://auth_service_lb/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # CORS headers for auth API
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        }

        # location /api/chatbot/ {
        #     proxy_pass http://chatbot_service_lb/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # Bloquear redirección específica a /app
        location = /app {
            rewrite ^ / redirect;
        }

        # Todas las demás rutas al frontend con Load Balancing
        location / {
            proxy_pass http://frontend_lb/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect off;

            # Headers informativos
            add_header X-Load-Balancer "nginx";
            add_header X-Upstream-Server $upstream_addr;
            add_header X-Frontend-SSL-Protected "true" always;
        }

        # Página de estado del load balancer
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # SSL Status Page
        location /ssl-status {
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            return 200 "SSL Status: Active\nProtocol: $ssl_protocol\nCipher: $ssl_cipher\nSession ID: $ssl_session_id\n";
            add_header Content-Type text/plain;
        }

        # WAF Status Page (solo para debugging)
        location /waf-status {
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            return 200 "WAF Status: Active\nVersion: 1.0\nProtected Routes: /graphql\n";
            add_header Content-Type text/plain;
        }

        # Error pages
        error_page 497 https://$server_name$request_uri;
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        error_page 429 /429.html;
        error_page 403 /403.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }

        location = /404.html {
            root /usr/share/nginx/html;
        }

        location = /429.html {
            root /usr/share/nginx/html;
        }

        location = /403.html {
            root /usr/share/nginx/html;
        }

        # Deshabilitar acceso a archivos .htaccess
        location ~ /\.ht {
            deny all;
        }

        # Redirección unificada para URLs con puerto 5000
        location ~* ^/.*:5000/api/ {
            rewrite ^/.*:5000/api/(.*)$ /api/$1 last;
        }
    }
}